<!doctype html>
<html lang="en" class="dark-mode">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/icon.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FreePlay Minecraft Launcher</title>
		<script>
			if (
				window.location.pathname.includes('overlay') ||
				window.location.hash.includes('overlay') ||
				window.location.search.includes('overlay') ||
				window.location.href.includes('overlay')
			) {
				document.documentElement.classList.add('is-overlay-mode')
			}
		</script>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #05020a;
				user-select: none;
				-webkit-user-select: none;
			}

			html.is-overlay-mode,
			html.is-overlay-mode body,
			html.is-overlay-mode #app,
			html.is-overlay-mode #teleports {
				background: transparent !important;
				background-color: transparent !important;
			}

			html.is-overlay-mode .initial-splash {
				display: none !important;
			}

			.initial-splash {
				position: fixed;
				inset: 0;
				z-index: 10000;
				background: radial-gradient(circle at 50% 50%, #0c0618 0%, #05020a 60%, #020104 100%);
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				user-select: none;
			}

			.initial-orb {
				position: absolute;
				border-radius: 50%;
				filter: blur(90px);
				pointer-events: none;
				opacity: 0.65;
			}

			.initial-orb-1 {
				width: 550px;
				height: 550px;
				background: radial-gradient(
					circle,
					rgba(168, 85, 247, 0.7) 0%,
					rgba(147, 51, 234, 0.25) 55%,
					transparent 80%
				);
				top: -15%;
				left: 10%;
			}

			.initial-orb-2 {
				width: 650px;
				height: 650px;
				background: radial-gradient(
					circle,
					rgba(6, 182, 212, 0.65) 0%,
					rgba(59, 130, 246, 0.2) 60%,
					transparent 80%
				);
				bottom: -20%;
				right: 5%;
			}

			.initial-grid {
				position: absolute;
				inset: -60%;
				background-image:
					linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
					linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
				background-size: 54px 54px;
				transform: perspective(700px) rotateX(28deg) translateY(-30px);
				mask-image: radial-gradient(circle at 50% 50%, black 15%, transparent 70%);
				-webkit-mask-image: radial-gradient(circle at 50% 50%, black 15%, transparent 70%);
				pointer-events: none;
				opacity: 0.55;
			}

			.initial-halo {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 520px;
				height: 520px;
				background: radial-gradient(
					circle,
					rgba(168, 85, 247, 0.28) 0%,
					rgba(6, 182, 212, 0.12) 45%,
					transparent 70%
				);
				border-radius: 50%;
				pointer-events: none;
				filter: blur(45px);
			}

			.initial-stage {
				display: flex;
				flex-direction: column;
				align-items: center;
				position: relative;
				z-index: 10;
			}

			.initial-logo-container {
				display: flex;
				justify-content: center;
				align-items: center;
				margin-bottom: 28px;
			}

			.initial-logo {
				height: 4.2rem;
				width: auto;
				max-width: 90vw;
			}

			.initial-loader-wrapper {
				width: 280px;
				height: 4px;
				background: rgba(255, 255, 255, 0.08);
				border-radius: 9999px;
				overflow: hidden;
				margin-bottom: 16px;
				box-shadow:
					0 0 20px rgba(0, 0, 0, 0.8),
					inset 0 1px 2px rgba(0, 0, 0, 0.6);
				position: relative;
			}

			.initial-loader-bar {
				height: 100%;
				width: 30%;
				background: linear-gradient(90deg, #ec4899, #a855f7, #6366f1, #06b6d4, #38bdf8);
				border-radius: 9999px;
				box-shadow: 0 0 16px rgba(168, 85, 247, 0.9);
			}

			.initial-loading-message {
				font-family:
					'Inter',
					system-ui,
					-apple-system,
					sans-serif;
				font-size: 11px;
				font-weight: 700;
				color: rgba(255, 255, 255, 0.85);
				letter-spacing: 0.12em;
				text-transform: uppercase;
				text-shadow:
					0 2px 10px rgba(0, 0, 0, 0.9),
					0 0 14px rgba(168, 85, 247, 0.3);
			}
		</style>

		<link rel="stylesheet" href="/src/assets/stylesheets/global.scss" />
	</head>

	<body>
		<div id="app">
			<div class="initial-splash">
				<div class="initial-orb initial-orb-1"></div>
				<div class="initial-orb initial-orb-2"></div>
				<div class="initial-grid"></div>
				<div class="initial-halo"></div>

				<div class="initial-stage" data-tauri-drag-region>
					<div class="initial-logo-container">
						<svg
							class="initial-logo"
							viewBox="0 0 460 100"
							fill="none"
							xmlns="http://www.w3.org/2000/svg"
						>
							<defs>
								<linearGradient id="fp-gem-top" x1="0%" y1="0%" x2="100%" y2="100%">
									<stop offset="0%" stop-color="#e0f2fe" />
									<stop offset="100%" stop-color="#38bdf8" />
								</linearGradient>
								<linearGradient id="fp-gem-left" x1="0%" y1="0%" x2="100%" y2="100%">
									<stop offset="0%" stop-color="#d8b4fe" />
									<stop offset="100%" stop-color="#7c3aed" />
								</linearGradient>
								<linearGradient id="fp-gem-right" x1="0%" y1="0%" x2="100%" y2="100%">
									<stop offset="0%" stop-color="#38bdf8" />
									<stop offset="100%" stop-color="#0284c7" />
								</linearGradient>
								<linearGradient id="fp-gem-front-left" x1="0%" y1="0%" x2="100%" y2="100%">
									<stop offset="0%" stop-color="#c084fc" />
									<stop offset="100%" stop-color="#6366f1" />
								</linearGradient>
								<linearGradient id="fp-gem-front-right" x1="0%" y1="0%" x2="100%" y2="100%">
									<stop offset="0%" stop-color="#22d3ee" />
									<stop offset="100%" stop-color="#0891b2" />
								</linearGradient>
								<linearGradient id="fp-holo-chroma" x1="0%" y1="0%" x2="100%" y2="0%">
									<stop offset="0%" stop-color="#ffffff" />
									<stop offset="20%" stop-color="#c084fc" />
									<stop offset="40%" stop-color="#38bdf8" />
									<stop offset="60%" stop-color="#ffffff" />
									<stop offset="80%" stop-color="#f472b6" />
									<stop offset="100%" stop-color="#38bdf8" />
								</linearGradient>
								<filter id="fp-neon-glow" x="-40%" y="-40%" width="180%" height="180%">
									<feGaussianBlur stdDeviation="10" result="blur" />
									<feComposite in="SourceGraphic" in2="blur" operator="over" />
								</filter>
								<filter id="fp-gem-aura" x="-60%" y="-60%" width="220%" height="220%">
									<feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
									<feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2" />
									<feMerge>
										<feMergeNode in="blur2" />
										<feMergeNode in="blur1" />
										<feMergeNode in="SourceGraphic" />
									</feMerge>
								</filter>
							</defs>

							<g transform="translate(18, 12)" filter="url(#fp-gem-aura)">
								<polygon points="38,4 58,22 38,34 18,22" fill="url(#fp-gem-top)" opacity="0.95" />
								<polygon points="18,22 38,34 38,54 8,36" fill="url(#fp-gem-left)" opacity="0.9" />
								<polygon
									points="58,22 38,34 38,54 68,36"
									fill="url(#fp-gem-right)"
									opacity="0.95"
								/>
								<polygon points="8,36 38,54 38,72" fill="url(#fp-gem-front-left)" opacity="0.85" />
								<polygon points="68,36 38,54 38,72" fill="url(#fp-gem-front-right)" opacity="0.9" />
								<polygon points="38,4 48,22 38,34" fill="#ffffff" opacity="0.5" />
								<polygon points="38,34 38,54 28,32" fill="#ffffff" opacity="0.35" />
								<line
									x1="38"
									y1="4"
									x2="38"
									y2="72"
									stroke="rgba(255,255,255,0.6)"
									stroke-width="1.2"
								/>
							</g>

							<g transform="translate(108, 0)">
								<text
									x="0"
									y="62"
									font-family="'Inter', 'Montserrat', system-ui, -apple-system, sans-serif"
									font-size="46"
									font-weight="900"
									letter-spacing="0.14em"
									fill="#a855f7"
									opacity="0.4"
									filter="url(#fp-neon-glow)"
								>
									FREEPLAY
								</text>
								<text
									x="0"
									y="62"
									font-family="'Inter', 'Montserrat', system-ui, -apple-system, sans-serif"
									font-size="46"
									font-weight="900"
									letter-spacing="0.14em"
									fill="url(#fp-holo-chroma)"
								>
									FREEPLAY
								</text>
							</g>
						</svg>
					</div>

					<div class="initial-loader-wrapper">
						<div class="initial-loader-bar"></div>
					</div>
					<span class="initial-loading-message">Starting FreePlay...</span>
				</div>
			</div>
		</div>
		<script>
			if (
				window.location.pathname.includes('overlay') ||
				window.location.hash.includes('overlay')
			) {
				document.documentElement.classList.add('is-overlay-mode')
			}

			// Early boot protections
			window.addEventListener('contextmenu', (e) => e.preventDefault(), { capture: true })
			window.addEventListener(
				'keydown',
				(e) => {
					if (
						e.key === 'F5' ||
						((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R')) ||
						e.key === 'F7'
					) {
						e.preventDefault()
						e.stopPropagation()
					}
				},
				{ capture: true },
			)
		</script>
		<script src="https://tally.so/widgets/embed.js" async></script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
