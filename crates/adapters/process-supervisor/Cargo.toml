[package]
name = "freeplay-process-supervisor"
version = "0.1.0"
edition = "2021"
description = "Child process supervisor and Minecraft launcher for FreePlay Launcher"
license = "GPL-3.0"

[dependencies]
freeplay-domain = { path = "../../core/domain" }
freeplay-application = { path = "../../core/application" }
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
regex = "1.12.2"
tracing = "0.1.41"
dirs = "6.0.0"
uuid = { version = "1.18", features = ["v4", "v3", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"

