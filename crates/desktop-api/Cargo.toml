[package]
name = "freeplay-desktop-api"
version = "0.1.0"
edition = "2021"
description = "Tauri IPC Command and Event Bridge for FreePlay Minecraft Launcher"
license = "GPL-3.0"

[dependencies]
freeplay-domain = { path = "../core/domain" }
freeplay-application = { path = "../core/application" }
serde = { version = "1.0", features = ["derive"] }
specta = { version = "=2.0.0-rc.20", features = ["derive", "chrono", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
