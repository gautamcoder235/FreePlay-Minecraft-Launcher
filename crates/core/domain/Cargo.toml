[package]
name = "freeplay-domain"
version = "0.1.0"
edition = "2021"
description = "Pure domain models and state machines for FreePlay Minecraft Launcher (Zero I/O)"
license = "GPL-3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
specta = { version = "=2.0.0-rc.20", features = ["derive", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
md5 = "0.7"
thiserror = "2.0"
