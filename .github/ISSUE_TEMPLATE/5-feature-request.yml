name: 💡 Feature Request
description: Suggest an idea, enhancement, or new feature for FreePlay.
labels: [enhancement]
type: 'feature'
body:
  - type: checkboxes
    attributes:
      label: Please confirm the following
      options:
        - label: I checked the [existing issues](https://github.com/gautamcoder235/FreePlay-Minecraft-Launcher/issues?q=is%3Aissue) for duplicate feature requests
          required: true
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      multiple: true
      options:
        - Launcher Core & Instance Management
        - Dedicated Server Hosting & Control Room
        - In-Game Overlay
        - UI / UX & 3D Skin Wardrobe
        - System Tray Integration
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem Description / Motivation
      description: A clear and concise explanation of what problem this feature solves or why it would be beneficial.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution & Design
      description: Detailed description of how you envision this feature working.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
      description: Mockups, screenshots, or extra context.
    validations:
      required: false
