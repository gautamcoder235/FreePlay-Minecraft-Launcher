name: 👥 Bug with FreePlay Server Hosting
description: For issues with the FreePlay Server Control Room, local hosting, or tunnels.
labels: [hosting, bug]
type: 'bug'
body:
  - type: checkboxes
    attributes:
      label: Please confirm the following
      options:
        - label: I checked the [existing issues](https://github.com/gautamcoder235/FreePlay-Minecraft-Launcher/issues?q=is%3Aissue) for duplicate problems
          required: true
        - label: I have verified my server jar and settings
          required: true
  - type: dropdown
    id: server-engine
    attributes:
      label: Server Engine
      options:
        - PaperMC
        - Purpur
        - Fabric
        - Spigot
        - Vanilla
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the server or hosting issue is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Server Control Room
        2. Click 'Start Server'
        3. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Server Logs / Console Output
      description: Provide relevant server console logs.
    validations:
      required: false
